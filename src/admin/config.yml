# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: sidikasehgal/personal-website
  branch: main

media_folder: src/images/uploads
public_folder: /images/uploads

singletons:
  - name: writing
    label: On UX Writing
    file: src/_data/writing.json
    icon: article
    fields:
      - name: articles
        label: Articles
        label_singular: Article
        widget: list
        summary: "{{fields.title}}"
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: url, label: Link, widget: string }
          - { name: publisher, label: Publisher, widget: string }
          - { name: date, label: Date published, widget: datetime, type: date, format: "YYYY-MM-DD" }
      - name: videos
        label: Videos
        label_singular: Video
        widget: list
        summary: "{{fields.title}}"
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: url, label: Link, widget: string }
          - { name: publisher, label: Publisher, widget: string }
          - { name: date, label: Date published, widget: datetime, type: date, format: "YYYY-MM-DD" }
      - name: posts
        label: Posts
        label_singular: Post
        widget: list
        summary: "{{fields.title}}"
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: url, label: Link, widget: string }
          - { name: publisher, label: Publisher, widget: string }
          - { name: date, label: Date published, widget: datetime, type: date, format: "YYYY-MM-DD" }

  - name: current_read
    label: Currently reading
    file: src/_data/currentRead.json
    icon: auto_stories
    fields:
      - { name: title, label: Title, widget: string }
      - { name: author, label: Author, widget: string }
      - name: isbn
        label: ISBN
        widget: string
        required: false
        hint: "13-digit ISBN, no dashes. Cover is pulled automatically from Open Library. Leave blank if you're using a cover image URL below."
      - name: coverUrl
        label: Cover image URL
        widget: string
        required: false
        hint: "Optional. Paste a direct image link to use instead of the ISBN. Right-click any cover online and choose 'Copy image address'. Overrides the ISBN when both are filled."

  - name: books
    label: Book recommendations
    file: src/_data/books.json
    icon: library_books
    fields:
      - name: books
        label: Books
        label_singular: Book
        widget: list
        root: true
        summary: "{{fields.title}} — {{fields.author}}"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: author, label: Author, widget: string }
          - name: genre
            label: Genre
            widget: select
            options:
              - Literary fiction
              - Crime fiction
              - Magical realism
              - Historical fiction
              - Coming of age
              - Science fiction
              - Play
              - Non-fiction
              - Biography / autobiography
              - Business
              - Food
          - name: region
            label: Region
            widget: select
            options:
              - India
              - Asia
              - UK
              - Ireland
              - Europe
              - USA
              - South America
              - Australia
