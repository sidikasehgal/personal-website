backend:
  name: github
  repo: sidikasehgal/personal-website
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "bookshelf"
    label: "Bookshelf"
    folder: "src/bookshelf"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - label: "Rating"
        name: "rating"
        widget: "select"
        options: ["5", "4", "3", "2", "1"]
        required: false
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "reading_list"
    label: "Reading list"
    folder: "src/reading-list"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Want to read", "Currently reading", "Finished"]
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "portfolio"
    label: "Portfolio"
    folder: "src/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Link", name: "link", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }

  - name: "writing"
    label: "Writing"
    folder: "src/writing"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
